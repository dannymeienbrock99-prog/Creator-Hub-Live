name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "builds/**"

permissions:
  contents: write

concurrency:
  group: creatorhub-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      TARGET_SHA: ${{ github.sha }}
      APK_NAME: CreatorHub-Live-v1.4.1-Stable.apk
      SHA_NAME: CreatorHub-Live-v1.4.1-Stable.sha256

    steps:
      - name: Clone Android project
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" source
          cd source
          git checkout --detach "${TARGET_SHA}"

      - name: Prepare Android build tools
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${JAVA_HOME_17_X64:-}" ]; then
            export JAVA_HOME="${JAVA_HOME_17_X64}"
          else
            export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          fi
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          echo "${JAVA_HOME}/bin" >> "${GITHUB_PATH}"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "${SDK_ROOT}" ]; then
            echo "Android SDK wurde auf dem Runner nicht gefunden."
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "${SDKMANAGER}" ]; then
            yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true
            "${SDKMANAGER}" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          fi

          curl --fail --location --retry 6 --retry-delay 5 \
            --output gradle-8.9-bin.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/gradle-8.9/bin" >> "${GITHUB_PATH}"

      - name: Compile and verify Android APK
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "${APK_PATH}"
          cp "${APK_PATH}" "${RUNNER_TEMP}/${APK_NAME}"
          sha256sum "${RUNNER_TEMP}/${APK_NAME}" > "${RUNNER_TEMP}/${SHA_NAME}"
          unzip -t "${RUNNER_TEMP}/${APK_NAME}" >/dev/null

      - name: Publish Android APK to repository
        shell: bash
        run: |
          set -euo pipefail

          publish_file() {
            local local_file="$1"
            local repo_path="$2"
            local existing_sha payload_file

            existing_sha="$(curl --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/contents/${repo_path}?ref=main" \
              | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data.get("sha", ""))' 2>/dev/null || true)"

            payload_file="${RUNNER_TEMP}/upload-$(basename "${repo_path}").json"
            python3 -c 'import base64,json,sys; path,sha,out=sys.argv[1:4]; data={"message":"[skip ci] Publish stable Android APK","content":base64.b64encode(open(path,"rb").read()).decode("ascii"),"branch":"main"}; data.update({"sha":sha} if sha else {}); open(out,"w",encoding="utf-8").write(json.dumps(data))' "${local_file}" "${existing_sha}" "${payload_file}"

            curl --fail-with-body --location --request PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/contents/${repo_path}" \
              --data-binary "@${payload_file}"
          }

          publish_file "${RUNNER_TEMP}/${APK_NAME}" "builds/${APK_NAME}"
          publish_file "${RUNNER_TEMP}/${SHA_NAME}" "builds/${SHA_NAME}"
