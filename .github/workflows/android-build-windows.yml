name: Android APK Build Windows

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "builds/**"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Compile tests and build APK
        shell: pwsh
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Verify APK
        shell: pwsh
        run: |
          $apk = "app/build/outputs/apk/debug/app-debug.apk"
          if (!(Test-Path $apk)) { throw "APK wurde nicht erzeugt" }
          if ((Get-Item $apk).Length -le 0) { throw "APK ist leer" }
          Get-FileHash $apk -Algorithm SHA256

      - name: Upload stable APK
        uses: actions/upload-artifact@v4
        with:
          name: CreatorHub-Live-v1.4.0-Stable-Windows
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
