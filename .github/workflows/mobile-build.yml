name: Mobile Builds

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CreatorHub-Live-Android
          path: app/build/outputs/apk/debug/app-debug.apk

  ios-simulator:
    name: iOS Simulator App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build for iPhone Simulator
        working-directory: ios
        run: |
          xcodebuild \
            -project CreatorHubLive.xcodeproj \
            -scheme CreatorHubLive \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package simulator app
        working-directory: ios
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r ../../../../CreatorHub-Live-iOS-Simulator.zip CreatorHubLive.app
      - uses: actions/upload-artifact@v4
        with:
          name: CreatorHub-Live-iOS-Simulator
          path: ios/CreatorHub-Live-iOS-Simulator.zip
