name: Android APK Build macOS

on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: creatorhub-android-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disabled:
    if: ${{ false }}
    runs-on: macos-latest
    steps:
      - run: echo "Disabled. Stable APK Builder no marketplace actions is active."
