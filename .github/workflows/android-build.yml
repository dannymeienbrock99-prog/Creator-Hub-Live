name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: creatorhub-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile tests and build debug APK
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CreatorHub-Live-v1.3.4
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
