name: Stable APK Builder no marketplace actions

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "builds/**"

permissions:
  contents: write

concurrency:
  group: creatorhub-stable-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      TARGET_SHA: ${{ github.sha }}
      APK_REPO_PATH: builds/CreatorHub-Live-v1.3.5-Stable.apk
      CHECKSUM_REPO_PATH: builds/CreatorHub-Live-v1.3.5-Stable.sha256

    steps:
      - name: Clone exact repository revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" source
          cd source
          git checkout --detach "${TARGET_SHA}"

      - name: Prepare Java Android SDK and Gradle
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${JAVA_HOME_17_X64:-}" ]; then
            export JAVA_HOME="${JAVA_HOME_17_X64}"
          else
            export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          fi
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          echo "${JAVA_HOME}/bin" >> "${GITHUB_PATH}"

          SDKMANAGER="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "${SDKMANAGER}" ]; then
            yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true
            "${SDKMANAGER}" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          fi

          curl --fail --location --retry 5 --retry-delay 5 \
            --output gradle-8.9-bin.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/gradle-8.9/bin" >> "${GITHUB_PATH}"

      - name: Compile tests and build stable APK
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "${RUNNER_TEMP}/CreatorHub-Live-v1.3.5-Stable.apk"
          sha256sum "${RUNNER_TEMP}/CreatorHub-Live-v1.3.5-Stable.apk" > "${RUNNER_TEMP}/CreatorHub-Live-v1.3.5-Stable.sha256"

      - name: Publish APK into repository
        shell: bash
        run: |
          set -euo pipefail
          publish_file() {
            local local_file="$1"
            local repo_path="$2"
            local existing_sha payload_file
            existing_sha="$(curl --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/contents/${repo_path}?ref=main" \
              | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data.get("sha", ""))' 2>/dev/null || true)"

            payload_file="${RUNNER_TEMP}/github-upload-$(basename "${repo_path}").json"
            python3 -c 'import base64,json,sys; path,sha,out=sys.argv[1:4]; data={"message":"[skip ci] Publish Creator Hub Live 1.3.5 stable APK","content":base64.b64encode(open(path,"rb").read()).decode("ascii"),"branch":"main"}; data.update({"sha":sha} if sha else {}); open(out,"w",encoding="utf-8").write(json.dumps(data))' "${local_file}" "${existing_sha}" "${payload_file}"

            curl --fail-with-body --location --request PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/contents/${repo_path}" \
              --data-binary "@${payload_file}"
          }

          publish_file "${RUNNER_TEMP}/CreatorHub-Live-v1.3.5-Stable.apk" "${APK_REPO_PATH}"
          publish_file "${RUNNER_TEMP}/CreatorHub-Live-v1.3.5-Stable.sha256" "${CHECKSUM_REPO_PATH}"
